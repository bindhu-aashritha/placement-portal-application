{% extends "base.html" %}

{% block title %}Student Profile {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
        <h3>Update Profile</h3>
        <form action="{{ url_for('update_profile') }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label font-weight-bold">Phone Number</label>
                <input type="text" name="phone" class="form-control" 
                       placeholder="Enter phone number" 
                       value="{{ student.phone or '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Educational Qualification</label>
                <input type="text" name="education" class="form-control" placeholder="eg. B.Tech CSE- 8.6 Cgpa" value="{{ student.education or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Skills</label>
                <textarea name="skills" class="form-control" rows="3" placeholder="Java, Python, SQL">{{ student.skills or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Upload Resume (PDF)</label>
                <input type="file" name="resume" class="form-control" accept=".pdf">
                {% if student.resume %}
                    <div class="mt-2 p-2 bg-light rounded d-flex align-items-center">
                    <i class="bi bi-file-earmark-pdf text-danger me-2"></i>
                    <span class="small me-auto text-truncate" style="max-width: 200px;">{{ student.resume }}</span>
                    </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>
        <div class="text-center mt-3"><a href="{{ url_for('dashboard') }}">Go to Dashboard</a></div>
    </div>
</div>
{% endblock %}
