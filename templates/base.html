<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="bg-dark mb-4 shadow-sm">
    <div class="container py-2 d-flex align-items-center">
        <span class="text-decoration-none text-white fw-bold">Placement Portal</span>
        <span class="text-white mx-3"></span>
        <a href="{{ url_for('index') }}" class="text-decoration-none text-info fw-bold">Home</a>
        <span class="text-white mx-3">|</span>
        <a href="{{ url_for('login') }}" class="text-decoration-none text-info fw-bold">Login</a>     
        <span class="text-white mx-3">|</span>
        <a href="{{ url_for('student_register') }}" class="text-decoration-none text-info fw-bold">Student Register</a>
        <span class="text-white mx-3">|</span>
        <a href="{{ url_for('company_register') }}" class="text-decoration-none text-info fw-bold">Company Register</a>
        <span class="text-white mx-3 ms-auto"></span>
        <a href="{{ url_for('logout') }}" class="text-decoration-none text-white fw-bold">Logout</a>
    </div>
</nav>

<div class="container mt-3">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
</div>

<main class="container-fluid px-3 px-md-4 py-4">
    {% block content %} {% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function validateForm(form) {
    const email = form.email?.value;
    const password = form.password?.value;

    if (email && !email.includes("@")) {
        alert("Invalid email format");
        return false;
    }

    if (password && password.length < 5) {
        alert("Password must be at least 5 characters");
        return false;
    }

    return true;
}
</script>
</body>
</html>
