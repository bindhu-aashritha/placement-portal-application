<!DOCTYPE html>
<html>
    <head>
        <title> Login Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
    <h1>Login</h1>
    <label for="your_name">Name:</label>
    <input type="text" name="your_name" id="your_name" value="" placeholder="Enter your name" /><br><br>
    <label for="role">Select your role:</label>
    <select name="role" id="role">
        <option value="student">Student</option>
        <option value="admin">Admin</option>
        <option value="company">Company</option>
    </select> <br><br>
    <label for="username">Username:</label>
    <input type="text" name="username" id="username" value="" placeholder="Enter username" /><br><br>
    <label for="pwd">Password:</label>
    <input type="password" name="pwd" id="pwd" value="" placeholder="Enter password" /><br><br>
    </body>
</html>
