{% extends "base.html" %}

{% block title %}Student Register {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 450px;">
        <h2 class="text-center">Student Registration</h2>
        <form action="/student/register" method="POST">
            <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
            <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
            <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number" required>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="text-center mt-3 small">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}
